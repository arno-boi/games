<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Kobo Games Launcher</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; text-align: center; background: white; color: black; margin: 0; }
        .kobo-page { page-break-after: always; break-after: page; min-height: 95vh; box-sizing: border-box; padding-bottom: 30px; }
        
        /* 🕹️ TIC-TAC-TOE BUTTON GRID LAYOUT */
        .ttt-row { margin: 10px 0; }
        .ttt-btn { width: 85px; height: 85px; font-size: 38px; font-weight: bold; background: white; border: 4px solid black; margin: 4px; padding: 0; cursor: pointer; text-align: center; vertical-align: middle; color: black; }
        
        /* ⌨️ HANGMAN NATIVE FIXED BUTTON KEYBOARD */
        .kb-row { margin: 8px 0; clear: both; }
        .letter-btn { width: 32px; height: 42px; font-size: 16px; font-weight: bold; background: white; border: 3px solid black; cursor: pointer; margin: 3px; padding: 0; text-align: center; vertical-align: middle; color: black; }
        .letter-btn[disabled] { border: 1px dashed #ccc; color: #ccc; background: #eee; cursor: default; }
        
        .theme-select { font-size: 18px; padding: 6px; margin: 10px auto; border: 3px solid black; font-weight: bold; }
        .word-display { font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 15px auto; min-height: 40px; }
        button.action-btn { font-size: 18px; padding: 10px 25px; background: white; border: 3px solid black; cursor: pointer; margin-top: 15px; font-weight: bold; color: black; }
        .status-text { font-size: 22px; font-weight: bold; margin-top: 10px; min-height: 30px; }
    </style>
</head>
<body>

    <!-- 📖 PAGE 1: TIC-TAC-TOE -->
    <div class="kobo-page">
        <h2>Page 1: Tic-Tac-Toe</h2>
        <p>You are <b>X</b> | Computer is <b>O</b></p>
        
        <div class="ttt-row">
            <button class="ttt-btn" id="c0" onclick="cellClicked(0)">&nbsp;</button>
            <button class="ttt-btn" id="c1" onclick="cellClicked(1)">&nbsp;</button>
            <button class="ttt-btn" id="c2" onclick="cellClicked(2)">&nbsp;</button>
        </div>
        <div class="ttt-row">
            <button class="ttt-btn" id="c3" onclick="cellClicked(3)">&nbsp;</button>
            <button class="ttt-btn" id="c4" onclick="cellClicked(4)">&nbsp;</button>
            <button class="ttt-btn" id="c5" onclick="cellClicked(5)">&nbsp;</button>
        </div>
        <div class="ttt-row">
            <button class="ttt-btn" id="c6" onclick="cellClicked(6)">&nbsp;</button>
            <button class="ttt-btn" id="c7" onclick="cellClicked(7)">&nbsp;</button>
            <button class="ttt-btn" id="c8" onclick="cellClicked(8)">&nbsp;</button>
        </div>
        
        <div id="ttt-status" class="status-text">Your turn!</div>
        <button class="action-btn" onclick="resetTTT()">Restart Game</button>
    </div>


    <!-- 📖 PAGE 2: HANGMAN -->
    <div class="kobo-page">
        <h2>Page 2: Hangman</h2>
        <p>Choose a theme and guess the hidden word!</p>
        
        <select id="themeSelector" class="theme-select" onchange="startHangman()">
            <option value="animals">🐾 Animals</option>
            <option value="food">🍕 Food</option>
            <option value="sport">⚽ Sport</option>
            <option value="movies">🎬 Movies & TV</option>
            <option value="gaming">🎮 Video Games</option>
        </select>
        
        <div id="hm-status" class="status-text">Turns remaining: 6</div>
        <div class="word-display" id="wordBox">_ _ _ _ _</div>
        
        <div class="kb-row">
            <button class="letter-btn" id="key-Q" onclick="guessLetter('Q')">Q</button>
            <button class="letter-btn" id="key-W" onclick="guessLetter('W')">W</button>
            <button class="letter-btn" id="key-E" onclick="guessLetter('E')">E</button>
            <button class="letter-btn" id="key-R" onclick="guessLetter('R')">R</button>
            <button class="letter-btn" id="key-T" onclick="guessLetter('T')">T</button>
            <button class="letter-btn" id="key-Y" onclick="guessLetter('Y')">Y</button>
            <button class="letter-btn" id="key-U" onclick="guessLetter('U')">U</button>
            <button class="letter-btn" id="key-I" onclick="guessLetter('I')">I</button>
            <button class="letter-btn" id="key-O" onclick="guessLetter('O')">O</button>
            <button class="letter-btn" id="key-P" onclick="guessLetter('P')">P</button>
        </div>
        <div class="kb-row">
            <button class="letter-btn" id="key-A" onclick="guessLetter('A')">A</button>
            <button class="letter-btn" id="key-S" onclick="guessLetter('S')">S</button>
            <button class="letter-btn" id="key-D" onclick="guessLetter('D')">D</button>
            <button class="letter-btn" id="key-F" onclick="guessLetter('F')">F</button>
            <button class="letter-btn" id="key-G" onclick="guessLetter('G')">G</button>
            <button class="letter-btn" id="key-H" onclick="guessLetter('H')">H</button>
            <button class="letter-btn" id="key-J" onclick="guessLetter('J')">J</button>
            <button class="letter-btn" id="key-K" onclick="guessLetter('K')">K</button>
            <button class="letter-btn" id="key-L" onclick="guessLetter('L')">L</button>
        </div>
        <div class="kb-row">
            <button class="letter-btn" id="key-Z" onclick="guessLetter('Z')">Z</button>
            <button class="letter-btn" id="key-X" onclick="guessLetter('X')">X</button>
            <button class="letter-btn" id="key-C" onclick="guessLetter('C')">C</button>
            <button class="letter-btn" id="key-V" onclick="guessLetter('V')">V</button>
            <button class="letter-btn" id="key-B" onclick="guessLetter('B')">B</button>
            <button class="letter-btn" id="key-N" onclick="guessLetter('N')">N</button>
            <button class="letter-btn" id="key-M" onclick="guessLetter('M')">M</button>
        </div>
        
        <br>
        <button class="action-btn" onclick="startHangman()">New Word</button>
    </div>
    <!-- 🧠 GAME SCRIPTS -->
    <script>
        // ==================== GAME 1: TIC-TAC-TOE LOGIC ====================
        let tttBoard = { p0:"", p1:"", p2:"", p3:"", p4:"", p5:"", p6:"", p7:"", p8:"" };
        let tttActive = true;

        function cellClicked(idx) {
            let key = "p" + idx;
            if (tttBoard[key] === "" && tttActive) {
                tttBoard[key] = "X";
                updateTTTDisplay();
                
                if (checkTTTWin("X")) {
                    document.getElementById("ttt-status").innerText = "You Win! 🎉";
                    tttActive = false;
                    return;
                }
                if (isTTTFull()) {
                    document.getElementById("ttt-status").innerText = "It's a Tie! 🤝";
                    tttActive = false;
                    return;
                }
                
                tttActive = false;
                document.getElementById("ttt-status").innerText = "Computer thinking...";
                setTimeout(computerMove, 500);
            }
        }

        function isTTTFull() {
            for (let i = 0; i < 9; i++) {
                if (tttBoard["p" + i] === "") return false;
            }
            return true;
        }

        function computerMove() {
            let move = findTTTSmartMove("O") || findTTTSmartMove("X");
            if (move === null && tttBoard.p4 === "") move = 4;
            if (move === null) {
                let empty = [];
                for (let i = 0; i < 9; i++) { 
                    if (tttBoard["p" + i] === "") empty.push(i); 
                }
                if (empty.length > 0) move = empty[Math.floor(Math.random() * empty.length)];
            }
            if (move !== null) {
                tttBoard["p" + move] = "O";
                updateTTTDisplay();
                if (checkTTTWin("O")) {
                    document.getElementById("ttt-status").innerText = "Computer Wins! 🤖";
                } else if (isTTTFull()) {
                    document.getElementById("ttt-status").innerText = "It's a Tie! 🤝";
                } else {
                    document.getElementById("ttt-status").innerText = "Your turn!";
                    tttActive = true;
                }
            }
        }

        function checkTTTLine(p, i1, i2, i3) {
            let v1 = tttBoard["p" + i1];
            let v2 = tttBoard["p" + i2];
            let v3 = tttBoard["p" + i3];
            if (v1 === p && v2 === p && v3 === "") return i3;
            if (v1 === p && v3 === p && v2 === "") return i2;
            if (v2 === p && v3 === p && v1 === "") return i1;
            return null;
        }

        function findTTTSmartMove(player) {
            let r;
            r = checkTTTLine(player, 0, 1, 2); if (r !== null) return r;
            r = checkTTTLine(player, 3, 4, 5); if (r !== null) return r;
            r = checkTTTLine(player, 6, 7, 8); if (r !== null) return r;
            r = checkTTTLine(player, 0, 3, 6); if (r !== null) return r;
            r = checkTTTLine(player, 1, 4, 7); if (r !== null) return r;
            r = checkTTTLine(player, 2, 5, 8); if (r !== null) return r;
            r = checkTTTLine(player, 0, 4, 8); if (r !== null) return r;
            r = checkTTTLine(player, 2, 4, 6); if (r !== null) return r;
            return null;
        }

        function checkTTTWin(p) {
            if (tttBoard.p0 === p && tttBoard.p1 === p && tttBoard.p2 === p) return true;
            if (tttBoard.p3 === p && tttBoard.p4 === p && tttBoard.p5 === p) return true;
            if (tttBoard.p6 === p && tttBoard.p7 === p && tttBoard.p8 === p) return true;
            if (tttBoard.p0 === p && tttBoard.p3 === p && tttBoard.p6 === p) return true;
            if (tttBoard.p1 === p && tttBoard.p4 === p && tttBoard.p7 === p) return true;
            if (tttBoard.p2 === p && tttBoard.p5 === p && tttBoard.p8 === p) return true;
            if (tttBoard.p0 === p && tttBoard.p4 === p && tttBoard.p8 === p) return true;
            if (tttBoard.p2 === p && tttBoard.p4 === p && tttBoard.p6 === p) return true;
            return false;
        }

        function updateTTTDisplay() {
            for (let i = 0; i < 9; i++) { 
                let val = tttBoard["p" + i];
                document.getElementById("c" + i).innerHTML = (val === "") ? "&nbsp;" : val; 
            }
        }

        function resetTTT() {
            tttBoard = { p0:"", p1:"", p2:"", p3:"", p4:"", p5:"", p6:"", p7:"", p8:"" }; 
            tttActive = true;
            document.getElementById("ttt-status").innerText = "Your turn!"; 
            updateTTTDisplay();
        }

        // ==================== GAME 2: HANGMAN LOGIC ====================
        const wordsAnimals = "LION TIGER ZEBRA MONKEY ELEPHANT GIRAFFE DOLPHIN KANGAROO PENGUIN KOALA";
        const wordsFood = "PIZZA BURGER PASTA TACO SALAD STEAK CHICKEN SUSHI WAFFLE PANCAKE";
        const wordsSport = "SOCCER TENNIS BASKETBALL CRICKET RUGBY HOCKEY GOLF BOXING SWIMMING RUNNING";
        const wordsMovies = "BATMAN AVENGERS INCEPTION TITANIC SIMPSONS POKEMON MATRIX TARZAN SHREK FROZEN";
        const wordsGaming = "MARIO ZELDA PACMAN TETRIS MINECRAFT POKEMON FORTNITE SONIC HALO DOOM";

        let secretWord = ""; 
        let guessedLetters = ""; 
        let remainingTurns = 6;

        function startHangman() {
            let chosenTheme = document.getElementById("themeSelector").value;
            let rawWordString = wordsAnimals;
            
            if (chosenTheme === "food") rawWordString = wordsFood;
            if (chosenTheme === "sport") rawWordString = wordsSport;
            if (chosenTheme === "movies") rawWordString = wordsMovies;
            if (chosenTheme === "gaming") rawWordString = wordsGaming;
            
            let pool = rawWordString.split(" ");
            secretWord = pool[Math.floor(Math.random() * pool.length)];
            guessedLetters = ""; 
            remainingTurns = 6;
            
            document.getElementById("hm-status").innerText = "Turns remaining: " + remainingTurns;
            
            let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < alphabet.length; i++) {
                let btn = document.getElementById("key-" + alphabet.charAt(i));
                if (btn) btn.disabled = false;
            }
            
            updateWordDisplay();
        }

        function updateWordDisplay() {
            let displayStr = "";
            let won = true;
            for (let i = 0; i < secretWord.length; i++) {
                let letter = secretWord.charAt(i);
                if (guessedLetters.indexOf(letter) !== -1) { 
                    displayStr += letter + " "; 
                } else { 
                    displayStr += "_ "; 
                    won = false;
                }
            }
            document.getElementById("wordBox").innerText = displayStr.trim();
            if (won) { 
                document.getElementById("hm-status").innerText = "You Won! 🎉"; 
                disableAllKeys(); 
            }
        }

        function guessLetter(letter) {
            if (guessedLetters.indexOf(letter) !== -1) return;
            guessedLetters += letter; 
            
            let btn = document.getElementById("key-" + letter);
            if (btn) btn.disabled = true;
            
            if (secretWord.indexOf(letter) !== -1) { 
                updateWordDisplay(); 
            } else {
                remainingTurns--; 
                document.getElementById("hm-status").innerText = "Turns remaining: " + remainingTurns;
                if (remainingTurns <= 0) { 
                    document.getElementById("hm-status").innerText = "Game Over! 🤖 Word was: " + secretWord; 
                    disableAllKeys(); 
                }
            }
        }

        function disableAllKeys() {
            let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let i = 0; i < alphabet.length; i++) {
                let btn = document.getElementById("key-" + alphabet.charAt(i));
                if (btn) btn.disabled = true;
            }
        }

        window.onload = function() { 
            resetTTT();
            startHangman(); 
        };
    </script>
</body>
</html>
