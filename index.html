<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kobo Tic-Tac-Toe</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: white; color: black; margin: 0; }
        .game-table { margin: 30px auto; border-collapse: collapse; }
        .cell-link { display: block; width: 85px; height: 85px; font-size: 46px; font-weight: bold; color: black; text-decoration: none; line-height: 85px; text-align: center; background: white; }
        .cell-td { width: 85px; height: 85px; border: 4px solid black; padding: 0; }
        .menu-link { display: inline-block; font-size: 18px; font-weight: bold; color: black; text-decoration: none; padding: 10px 20px; border: 3px solid black; margin: 20px; background: white; }
        .status-text { font-size: 24px; font-weight: bold; margin-top: 15px; min-height: 35px; }
    </style>
</head>
<body>

    <h2>Tic-Tac-Toe</h2>
    <p>Tap any blank dot link to place your <b>X</b>.</p>
    
    <table class="game-table">
        <tr>
            <td class="cell-td"><a id="l0" class="cell-link" href="#X0">.</a></td>
            <td class="cell-td"><a id="l1" class="cell-link" href="#X1">.</a></td>
            <td class="cell-td"><a id="l2" class="cell-link" href="#X2">.</a></td>
        </tr>
        <tr>
            <td class="cell-td"><a id="l3" class="cell-link" href="#X3">.</a></td>
            <td class="cell-td"><a id="l4" class="cell-link" href="#X4">.</a></td>
            <td class="cell-td"><a id="l5" class="cell-link" href="#X5">.</a></td>
        </tr>
        <tr>
            <td class="cell-td"><a id="l6" class="cell-link" href="#X6">.</a></td>
            <td class="cell-td"><a id="l7" class="cell-link" href="#X7">.</a></td>
            <td class="cell-td"><a id="l8" class="cell-link" href="#X8">.</a></td>
        </tr>
    </table>
    
    <div id="ttt-status" class="status-text">Your turn!</div>
    <a class="menu-link" href="#RESET_TTT">Restart Grid</a>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let tttActive = true;

        function checkUrlChange() {
            let hash = window.location.hash;
            if (!hash) return;
            window.location.hash = ""; 

            if (hash.indexOf("#X") === 0 && tttActive) {
                let idx = parseInt(hash.charAt(2));
                if (board[idx] === "") {
                    board[idx] = "X";
                    runTttTurn();
                }
            }
            if (hash === "#RESET_TTT") {
                board = ["", "", "", "", "", "", "", "", ""]; tttActive = true;
                document.getElementById("ttt-status").innerText = "Your turn!";
                for(let i=0; i<9; i++) { document.getElementById("l"+i).innerText = "."; document.getElementById("l"+i).href = "#X"+i; }
            }
        }

        function checkLineAI(p, i1, i2, i3) {
            if (board[i1] === p && board[i2] === p && board[i3] === "") return i3;
            if (board[i1] === p && board[i3] === p && board[i2] === "") return i2;
            if (board[i2] === p && board[i3] === p && board[i1] === "") return i1;
            return null;
        }

        function findSmartMove(player) {
            let r;
            r = checkLineAI(player, 0, 1, 2); if (r !== null) return r;
            r = checkLineAI(player, 3, 4, 5); if (r !== null) return r;
            r = checkLineAI(player, 6, 7, 8); if (r !== null) return r;
            r = checkLineAI(player, 0, 3, 6); if (r !== null) return r;
            r = checkLineAI(player, 1, 4, 7); if (r !== null) return r;
            r = checkLineAI(player, 2, 5, 8); if (r !== null) return r;
            r = checkLineAI(player, 0, 4, 8); if (r !== null) return r;
            r = checkLineAI(player, 2, 4, 6); if (r !== null) return r;
            return null;
        }

        function runTttTurn() {
            updateTttView();
            if (checkTttWin("X")) { document.getElementById("ttt-status").innerText = "You Win! 🎉"; tttActive = false; return; }
            if (!board.includes("")) { document.getElementById("ttt-status").innerText = "It's a Tie! 🤝"; tttActive = false; return; }
            
            let cpuMove = findSmartMove("O");
            if (cpuMove === null) cpuMove = findSmartMove("X");
            if (cpuMove === null && board[4] === "") cpuMove = 4;
            if (cpuMove === null) {
                let empty = [];
                for (let i = 0; i < 9; i++) { if (board[i] === "") empty.push(i); }
                if (empty.length > 0) cpuMove = empty[Math.floor(Math.random() * empty.length)];
            }
            
            if (cpuMove !== null) {
                board[cpuMove] = "O";
                updateTttView();
                if (checkTttWin("O")) { document.getElementById("ttt-status").innerText = "Computer Wins! 🤖"; tttActive = false; }
                else if (!board.includes("")) { document.getElementById("ttt-status").innerText = "It's a Tie! 🤝"; tttActive = false; }
            }
        }

        function updateTttView() {
            for(let i=0; i<9; i++) {
                if (board[i] !== "") {
                    document.getElementById("l"+i).innerText = board[i];
                    document.getElementById("l"+i).href = "#USED";
                }
            }
        }

        function checkTttWin(p) {
            if (board[0]===p && board[1]===p && board[2]===p) return true;
            if (board[3]===p && board[4]===p && board[5]===p) return true;
            if (board[6]===p && board[7]===p && board[8]===p) return true;
            if (board[0]===p && board[3]===p && board[6]===p) return true;
            if (board[1]===p && board[4]===p && board[7]===p) return true;
            if (board[2]===p && board[5]===p && board[8]===p) return true;
            if (board[0]===p && board[4]===p && board[8]===p) return true;
            if (board[2]===p && board[4]===p && board[6]===p) return true;
            return false;
        }

        setInterval(checkUrlChange, 100);
    </script>
</body>
</html>
